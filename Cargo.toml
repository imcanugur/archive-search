[package]
name = "archive-search"
version = "0.1.0"
edition = "2021"
description = "Ultra-fast local media archive explorer and hybrid search engine"

[dependencies]
anyhow = "1"
blake3 = "1"
crossbeam-channel = "0.5"
eframe = "0.29"
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
jwalk = "0.8"
memchr = "2"
rayon = "1.10"
thiserror = "2"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
